services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qa_commerce_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qa_commerce_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/qa_commerce_lab?schema=public
      JWT_SECRET: super-secret-key
      PORT: 3333
      FRONTEND_URL: http://localhost:4173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3333:3333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      VITE_PROXY_TARGET: http://backend:3333
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4173:4173"

  e2e:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    profiles: ["e2e"]
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:4173
      E2E_USER_EMAIL: qa.customer@example.com
      E2E_USER_PASSWORD: Password123!
    depends_on:
      frontend:
        condition: service_started

volumes:
  postgres_data:
