name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck, Build & Unit
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qa_commerce_lab?schema=public
      JWT_SECRET: ci-placeholder-secret-key
      PORT: 3333
      FRONTEND_URL: http://127.0.0.1:4173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests & Coverage
        run: npm run coverage

      - name: Test database and cleanup safety
        run: npm run test:safety

      - name: AI QA Unit Tests & Benchmark
        run: |
          npm run test:ai
          npm run ai:evaluate

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: apps/backend/coverage

  integration-and-e2e:
    name: API, E2E & Accessibility
    needs: quality-gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qa_commerce_lab_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qa_commerce_lab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qa_commerce_lab_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qa_commerce_lab_test?schema=public
      QA_CONFIRM_TEST_DB: qa_commerce_lab_test
      JWT_SECRET: ci-test-secret-key
      PORT: 3333
      FRONTEND_URL: http://127.0.0.1:4173
      VITE_PROXY_TARGET: http://127.0.0.1:3333

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Push schema
        run: npm run db:push

      - name: Seed database
        run: npm run db:test:seed

      - name: API tests
        run: npm run test:api:local

      - name: Reset isolated CI data for E2E
        run: npm run db:test:seed

      - name: Install Playwright Browsers
        run: npm run install:browsers --workspace @qa-commerce-lab/e2e

      - name: E2E & Accessibility tests
        run: npm run test:e2e:local

      - name: Generate AI QA Executive Report
        if: always()
        run: npm run ai:report

      - name: Upload Playwright report & AI QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            reports

  visual-windows:
    name: Visual regression (Windows Chromium)
    needs: quality-gate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Compare reviewed visual baseline
        run: npm run test:visual --workspace @qa-commerce-lab/e2e
      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-windows
          path: |
            tests/e2e/visual-report
            tests/e2e/test-results
